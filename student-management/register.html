<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduStudent - Đăng ký</title>

    <link rel="stylesheet"
          href="index.css">

</head>


<body>

<header class="header">

    <div class="container navbar">

        <a href="index.html"
           class="logo">

            <div class="logo-icon">
                🎓
            </div>

            <div class="logo-text">

                <strong>
                    EduStudent
                </strong>

                <span>
                    Quản lý học sinh
                </span>

            </div>

        </a>


        <nav class="nav">

            <a href="index.html">
                Trang chủ
            </a>

            <a href="tuition.html">
                Đóng học phí
            </a>

            <a href="reward.html">
                Thưởng
            </a>

            <a href="login.html">
                Đăng nhập
            </a>

            <a href="register.html"
               class="register-btn active-register">
                Đăng ký
            </a>

        </nav>

    </div>

</header>


<main>

    <section class="auth-page">

        <div class="auth-card register-card">

            <div class="auth-icon">
                📝
            </div>

            <h1>
                Đăng ký tài khoản
            </h1>

            <p>
                Tạo tài khoản mới
            </p>


            <form id="registerForm">

                <label>
                    Họ và tên
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Nhập họ và tên"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="example@gmail.com"
                    required
                >


                <label>
                    Tên đăng nhập
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Tạo tên đăng nhập"
                    required
                >


                <label>
                    Mật khẩu
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Tạo mật khẩu"
                    required
                >


                <label>
                    Nhập lại mật khẩu
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Nhập lại mật khẩu"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn full-btn">

                    Đăng ký

                </button>


                <div id="registerMessage"></div>

            </form>


            <div class="auth-footer">

                Đã có tài khoản?

                <a href="login.html">
                    Đăng nhập
                </a>

            </div>

        </div>

    </section>

</main>


<footer>

    <div class="container footer-content">

        <div>

            <strong>
                🎓 EduStudent
            </strong>

            <p>
                Hệ thống quản lý học sinh
            </p>

        </div>

        <p>
            © 2026 EduStudent
        </p>

    </div>

</footer>


<script src="index.js"></script>

</body>
</html>
